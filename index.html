const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().replace(/[\s\-_]/g,"");
const R=D.map(r=>({sku:r[0],m:r[1],mc:r[2],c:r[3],b:r[4],n:r[5],k:norm(r.join(" "))+" "+r.join(" ").toLowerCase()}));
$("#tot").textContent=R.length.toLocaleString();
let cat="",br="",lim=60,list=[];
const cats=[...new Set(R.map(r=>r.c))].map(c=>[c,R.filter(r=>r.c===c).length]).sort((a,b)=>b[1]-a[1]);
function chips(){
 $("#cats").innerHTML=`<button class="chip ${cat?"":"on"}" data-c="">All</button>`+cats.map(([c,n])=>`<button class="chip ${cat===c?"on":""}" data-c="${esc(c)}">${esc(c)} <small>${n}</small></button>`).join("");
 $("#brands").innerHTML=["","Singer","Beko"].map(b=>`<button class="chip ${br===b?"on":""}" data-b="${b}">${b||"All brands"}</button>`).join("");
}
function hl(t,terms){let o=esc(t);terms.forEach(x=>{if(x.length<1)return;try{o=o.replace(new RegExp("("+x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![^<]*>)","gi"),"<mark>$1</mark>")}catch(e){}});return o}
function run(){
 const raw=$("#q").value.trim().toLowerCase(),terms=raw.split(/\s+/).filter(Boolean);
 list=R.filter(r=>(!cat||r.c===cat)&&(!br||r.b===br)&&terms.every(t=>r.k.includes(t)||r.k.includes(norm(t))));
 if(terms.length)list.sort((a,b)=>{const s=r=>(norm(r.m).startsWith(norm(raw))?0:norm(r.m).includes(norm(raw))?1:2);return s(a)-s(b)});
 $("#stat").textContent=list.length.toLocaleString()+" result"+(list.length===1?"":"s");
 const out=list.slice(0,lim).map(r=>`<div class="item"><div><div class="model">${hl(r.m,terms)}</div><div class="meta"><span class="tag ${r.b}">${r.b}</span><span class="tag">${esc(r.c)}</span>SKU ${hl(r.sku,terms)}</div><div class="meta">${hl(r.mc,terms)}</div>${r.n?`<div class="name">${hl(r.n,terms)}</div>`:""}</div><button class="cp" data-v="${esc(r.m)}">Copy</button></div>`).join("");
 $("#list").innerHTML=out||'<div class="empty">No matching model found. Try fewer characters.</div>';
 $("#more").hidden=list.length<=lim;
}
$("#q").oninput=()=>{lim=60;run()};
$("#cats").onclick=e=>{const b=e.target.closest("[data-c]");if(b){cat=b.dataset.c;lim=60;chips();run()}};
$("#brands").onclick=e=>{const b=e.target.closest("[data-b]");if(b){br=b.dataset.b;lim=60;chips();run()}};
$("#more").onclick=()=>{lim+=100;run()};
$("#list").onclick=e=>{const b=e.target.closest(".cp");if(!b)return;const done=()=>{b.textContent="Copied ✓";setTimeout(()=>b.textContent="Copy",1200)};
 try{navigator.clipboard.writeText(b.dataset.v).then(done,done)}catch(x){done()}};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));["f","g","s"].forEach(i=>$("#"+i).hidden=i!==t.dataset.t)});
$("#gb").innerHTML=G.map(r=>"<tr>"+r.map(c=>`<td>${esc(String(c||""))}</td>`).join("")+"</tr>").join("");
const sm=cats.map(([c,n])=>{const s=R.filter(r=>r.c===c&&r.b==="Singer").length;return[c,s,n-s,n]});
$("#sb").innerHTML=sm.map(([c,s,b,n])=>`<tr><td>${esc(c)}</td><td>${s}</td><td>${b}</td><td><b>${n}</b></td><td>${(n/R.length*100).toFixed(1)}%</td></tr>`).join("")+`<tr><td><b>Total</b></td><td><b>${R.filter(r=>r.b==="Singer").length}</b></td><td><b>${R.filter(r=>r.b==="Beko").length}</b></td><td><b>${R.length}</b></td><td><b>100%</b></td></tr>`;
chips();run();
